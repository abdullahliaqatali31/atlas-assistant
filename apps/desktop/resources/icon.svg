<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#13233f"/>
      <stop offset="0.55" stop-color="#0a1426"/>
      <stop offset="1" stop-color="#04070e"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.12"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="46%" r="50%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.28" stop-color="#c8f7ff"/>
      <stop offset="0.62" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#0e7490" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0.45" stop-color="#22d3ee" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Tile -->
  <rect x="32" y="32" width="960" height="960" rx="224" fill="url(#bg)"/>
  <rect x="34" y="34" width="956" height="956" rx="222" fill="none" stroke="url(#edge)" stroke-width="4"/>

  <!-- Halo -->
  <circle cx="512" cy="512" r="380" fill="url(#halo)"/>

  <g transform="translate(512 512)" fill="none" stroke-linecap="round" filter="url(#glow)">
    <!-- Outer segmented ring: four arcs -->
    <g stroke="url(#ring)" stroke-width="30">
      <path d="M -276.9 -116.0 A 300 300 0 0 1 -116.0 -276.9"/>
      <path d="M 116.0 -276.9 A 300 300 0 0 1 276.9 -116.0"/>
      <path d="M 276.9 116.0 A 300 300 0 0 1 116.0 276.9"/>
      <path d="M -116.0 276.9 A 300 300 0 0 1 -276.9 116.0"/>
    </g>
    <!-- Warm accent arc -->
    <path d="M 92.5 -219.9 A 238 238 0 0 1 219.9 -92.5" stroke="#fbbf24" stroke-width="16"/>
    <!-- Inner thin ring -->
    <circle r="238" stroke="#67e8f9" stroke-opacity="0.45" stroke-width="6" stroke-dasharray="4 22"/>
    <circle r="176" stroke="#a5f3fc" stroke-opacity="0.55" stroke-width="8"/>
  </g>

  <!-- Core -->
  <circle cx="512" cy="512" r="150" fill="url(#core)"/>
  <circle cx="512" cy="512" r="64" fill="#ffffff" fill-opacity="0.92"/>
</svg>
